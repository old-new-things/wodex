name: Build and test

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      ref:
        description: Commit to test and build
        type: string
        default: ''

permissions:
  contents: read

jobs:
  desktop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev libsdl2-ttf-dev libcurl4-openssl-dev fonts-dejavu-core
      - name: Install Rust
        run: rustup toolchain install stable --profile minimal --component rustfmt,clippy
      - name: Check Rust
        run: |
          cargo +stable fmt --all -- --check
          cargo +stable clippy --workspace --all-targets --locked -- -D warnings
          cargo +stable test --workspace --locked
      - name: Build desktop client
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build/desktop --parallel
          ctest --test-dir build/desktop --output-on-failure

  switch:
    runs-on: ubuntu-latest
    container:
      image: devkitpro/devkita64:20260219
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Install pinned Rust cross compiler
        shell: bash
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain nightly-2026-10-01 --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build NRO
        shell: bash
        run: bash scripts/build-switch.sh
      - name: Prepare portable update assets
        shell: bash
        run: |
          cp VERSION LICENSE THIRD_PARTY.md build/switch/
          cp romfs/fonts/OFL.txt build/switch/NotoSansCJK-OFL.txt
          cp romfs/fonts/README.md build/switch/NotoSansCJK-README.md
          cd build/switch
          sha256sum wodex.nro > wodex.nro.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: wodex-switch
          path: |
            build/switch/wodex.nro
            build/switch/wodex.nro.sha256
            build/switch/VERSION
            build/switch/LICENSE
            build/switch/THIRD_PARTY.md
            build/switch/NotoSansCJK-OFL.txt
            build/switch/NotoSansCJK-README.md
            build/switch/wodex.elf
            build/switch/wodex.map
          if-no-files-found: error
