name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  desktop:
    name: Rust and desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev libsdl2-ttf-dev libcurl4-openssl-dev fonts-dejavu-core
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python3 -m unittest discover -s tests -p 'test_pages_state.py'
      - name: Build desktop client
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/desktop --parallel
      - name: Run all desktop integration suites
        run: ctest --test-dir build/desktop --output-on-failure --timeout 120
      - name: Save updater harness for packaged-NRO tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wodex-updater-harness
          path: build/desktop/wodex_update_tests
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  switch:
    name: Switch no_std build
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: devkitpro/devkita64:20260219
    env:
      WODEX_RUST_TOOLCHAIN: nightly-2026-10-01
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust cross compiler
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$WODEX_RUST_TOOLCHAIN" --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build NRO
        run: bash scripts/build-switch.sh
      - name: Check build-path privacy
        run: |
          if LC_ALL=C grep -aFq -e "$HOME/" -e "$GITHUB_WORKSPACE/" build/switch/wodex.nro; then
            echo "The NRO contains an unremapped builder path." >&2
            exit 1
          fi
      - name: Prepare portable update assets
        run: |
          cp VERSION LICENSE THIRD_PARTY.md build/switch/
          cp romfs/fonts/OFL.txt build/switch/NotoSansCJK-OFL.txt
          cp romfs/fonts/README.md build/switch/NotoSansCJK-README.md
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - licenses | gzip -n > build/switch/licenses.tar.gz
          cd build/switch
          sha256sum wodex.nro > wodex.nro.sha256
          sha256sum licenses.tar.gz > licenses.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wodex-switch
          overwrite: true
          path: |
            build/switch/wodex.nro
            build/switch/wodex.nro.sha256
            build/switch/VERSION
            build/switch/LICENSE
            build/switch/THIRD_PARTY.md
            build/switch/licenses.tar.gz
            build/switch/licenses.tar.gz.sha256
            build/switch/NotoSansCJK-OFL.txt
            build/switch/NotoSansCJK-README.md
            build/switch/wodex.elf
            build/switch/wodex.map
          if-no-files-found: error
          retention-days: 14

  packaged_update:
    name: Packaged NRO update tests
    needs: [desktop, switch]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install harness runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libsdl2-ttf-2.0-0 libcurl4t64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wodex-updater-harness
          path: build/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wodex-switch
          path: build/switch
      - name: Verify download, validation, installation, and rollback using the built NRO
        run: |
          chmod +x build/desktop/wodex_update_tests
          (cd build/switch && sha256sum --check wodex.nro.sha256 licenses.tar.gz.sha256)
          python3 tests/mock_updates.py build/desktop/wodex_update_tests build/switch/wodex.nro

  publish:
    name: Publish build channels
    needs: [desktop, switch, packaged_update]
    if: >-
      github.repository == 'old-new-things/wodex' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    concurrency:
      group: wodex-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      SITE_URL: https://old-new-things.github.io/wodex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wodex-switch
          path: build/switch
      - name: Restore published build history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/pages-state.py --repository "$GITHUB_REPOSITORY" prepare \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA" --ref "$GITHUB_REF" --site-url "$SITE_URL" \
            --artifact-dir build/switch --previous-dir build/pages-previous \
            --github-output "$GITHUB_OUTPUT"
      - name: Install publisher compiler
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Generate download page and update feed
        env:
          BUILD_CHANNEL: ${{ steps.history.outputs.channel }}
          BUILD_TAG: ${{ steps.history.outputs.tag }}
          BUILD_TIMESTAMP: ${{ steps.history.outputs.timestamp }}
          HAS_PREVIOUS: ${{ steps.history.outputs.has_previous }}
        run: |
          arguments=(
            --artifact-dir build/switch --output-dir build/pages
            --channel "$BUILD_CHANNEL" --timestamp "$BUILD_TIMESTAMP"
            --commit "$GITHUB_SHA" --base-url "$SITE_URL"
          )
          if [[ "$HAS_PREVIOUS" == true ]]; then
            arguments+=(--previous-dir build/pages-previous)
          fi
          if [[ "$BUILD_CHANNEL" == version ]]; then
            arguments+=(--tag "$BUILD_TAG")
          fi
          cargo run --locked --release -p wodex-publish-pages -- "${arguments[@]}"
      - name: Preserve publication snapshot
        id: snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wodex-pages-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages
      - name: Deploy download page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Retain two recovery snapshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_ID: ${{ steps.snapshot.outputs.artifact-id }}
          PREVIOUS_ARTIFACT_ID: ${{ steps.history.outputs.previous_artifact_id }}
        run: |
          arguments=(--repository "$GITHUB_REPOSITORY" prune --current-id "$CURRENT_ARTIFACT_ID")
          if [[ -n "$PREVIOUS_ARTIFACT_ID" ]]; then
            arguments+=(--previous-id "$PREVIOUS_ARTIFACT_ID")
          fi
          python3 scripts/pages-state.py "${arguments[@]}"
