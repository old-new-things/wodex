name: Build and test

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '17 0 * * *'

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_TERM_COLOR: always

jobs:
  identity:
    name: Build identity
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: read
    outputs:
      channel: ${{ steps.identity.outputs.channel }}
      timestamp: ${{ steps.identity.outputs.timestamp }}
      commit: ${{ steps.identity.outputs.commit }}
      metadata: ${{ steps.identity.outputs.metadata }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Resolve source workflow attempt
        id: identity
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 scripts/pages-build.py --repository "$GITHUB_REPOSITORY" \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$GITHUB_SHA" --ref "$GITHUB_REF" --event "$GITHUB_EVENT_NAME" \
            --github-output "$GITHUB_OUTPUT"

  desktop:
    name: Rust and desktop tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install native dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build pkg-config libsdl2-dev libsdl2-ttf-dev libcurl4-openssl-dev fonts-dejavu-core
      - name: Install Rust
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal --component rustfmt,clippy
      - name: Verify embedded browser client
        run: |
          npm ci --prefix tools/transfer-web --ignore-scripts --no-audit --no-fund
          npm run --prefix tools/transfer-web build
          git diff --exit-code -- romfs/transfer/transfer.js
      - name: Check Rust
        run: |
          cargo fmt --all -- --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          cargo test --workspace --locked
          python3 -m unittest discover -s tests -p 'test_*pages*.py'
          python3 scripts/build-home-menu.py --check
          python3 -m unittest discover -s tests -p 'test_home_menu*.py'
      - name: Check embedded update identity
        run: |
          for build_channel in nightly version; do
            WODEX_BUILD_CHANNEL="$build_channel" \
            WODEX_BUILD_TIMESTAMP=2026-10-20T12:34:56Z \
            WODEX_BUILD_COMMIT=0123456789abcdef0123456789abcdef01234567 \
              cargo test --locked -p wodex-core embedded_identity_prevents_reoffering_the_installed_build
          done
      - name: Build desktop client
        run: |
          cmake -S . -B build/desktop -G Ninja -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON
          cmake --build build/desktop --parallel
      - name: Run all desktop integration suites
        run: ctest --test-dir build/desktop --output-on-failure --timeout 120
      - name: Save updater harness for packaged-NRO tests
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wodex-updater-harness
          path: build/desktop/wodex_update_tests
          overwrite: true
          if-no-files-found: error
          retention-days: 1

  switch:
    name: Switch no_std build
    needs: identity
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: devkitpro/devkita64:20260219
    env:
      WODEX_RUST_TOOLCHAIN: nightly-2026-10-01
      WODEX_BUILD_CHANNEL: ${{ needs.identity.outputs.channel }}
      WODEX_BUILD_TIMESTAMP: ${{ needs.identity.outputs.timestamp }}
      WODEX_BUILD_COMMIT: ${{ needs.identity.outputs.commit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install pinned Rust cross compiler
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o /tmp/rustup-init.sh
          sh /tmp/rustup-init.sh -y --profile minimal --default-toolchain "$WODEX_RUST_TOOLCHAIN" --component rust-src
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Build NRO
        run: bash scripts/build-switch.sh
      - name: Check build-path privacy
        run: |
          if LC_ALL=C grep -aFq -e "$HOME/" -e "$GITHUB_WORKSPACE/" build/switch/wodex.nro; then
            echo "The NRO contains an unremapped builder path." >&2
            exit 1
          fi
      - name: Prepare portable update assets
        env:
          BUILD_METADATA: ${{ needs.identity.outputs.metadata }}
        run: |
          printf '%s\n' "$BUILD_METADATA" > build/switch/build-info.json
          cp VERSION LICENSE THIRD_PARTY.md build/switch/
          cp romfs/fonts/OFL.txt build/switch/NotoSansCJK-OFL.txt
          cp romfs/fonts/README.md build/switch/NotoSansCJK-README.md
          tar --sort=name --mtime='UTC 1970-01-01' --owner=0 --group=0 --numeric-owner \
            -cf - licenses | gzip -n > build/switch/licenses.tar.gz
          cd build/switch
          sha256sum wodex.nro > wodex.nro.sha256
          sha256sum licenses.tar.gz > licenses.tar.gz.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wodex-switch
          overwrite: true
          path: |
            build/switch/wodex.nro
            build/switch/wodex.nro.sha256
            build/switch/VERSION
            build/switch/build-info.json
            build/switch/LICENSE
            build/switch/THIRD_PARTY.md
            build/switch/licenses.tar.gz
            build/switch/licenses.tar.gz.sha256
            build/switch/NotoSansCJK-OFL.txt
            build/switch/NotoSansCJK-README.md
            build/switch/wodex.elf
            build/switch/wodex.map
          if-no-files-found: error
          retention-days: 14

  packaged_update:
    name: Packaged NRO update tests
    needs: [desktop, switch]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Install harness runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libsdl2-2.0-0 libsdl2-ttf-2.0-0 libcurl4t64
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wodex-updater-harness
          path: build/desktop
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wodex-switch
          path: build/switch
      - name: Verify download, validation, installation, and rollback using the built NRO
        run: |
          chmod +x build/desktop/wodex_update_tests
          (cd build/switch && sha256sum --check wodex.nro.sha256 licenses.tar.gz.sha256)
          python3 tests/mock_updates.py build/desktop/wodex_update_tests build/switch/wodex.nro

  publish:
    name: Dispatch publication
    needs: [desktop, switch, packaged_update]
    if: >-
      github.repository == 'old-new-things/wodex' &&
      (github.event_name == 'push' || github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      actions: write
    steps:
      - name: Dispatch verified build to Pages
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run publish.yml --repo "$GITHUB_REPOSITORY" --ref main \
            -f build_run_id="$GITHUB_RUN_ID" -f build_attempt="$GITHUB_RUN_ATTEMPT"
