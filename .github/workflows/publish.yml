name: Publish build channels
run-name: Publish build ${{ inputs.build_run_id }} attempt ${{ inputs.build_attempt }}

on:
  workflow_dispatch:
    inputs:
      build_run_id:
        description: Successful build workflow run ID
        required: true
        type: string
      build_attempt:
        description: Successful build workflow attempt number
        required: true
        type: string

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  publish:
    name: Publish build channels
    if: github.repository == 'old-new-things/wodex' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
      pages: write
      id-token: write
    concurrency:
      group: wodex-pages
      cancel-in-progress: false
      queue: max
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    env:
      RUSTUP_TOOLCHAIN: 1.99.0
      CARGO_TERM_COLOR: always
      SITE_URL: https://old-new-things.github.io/wodex
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Validate source build
        id: source
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ATTEMPT: ${{ inputs.build_attempt }}
        run: |
          python3 scripts/pages-state.py --repository "$GITHUB_REPOSITORY" source \
            --run-id "$BUILD_RUN_ID" --attempt "$BUILD_ATTEMPT" \
            --github-output "$GITHUB_OUTPUT"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: wodex-switch
          path: build/switch
          run-id: ${{ inputs.build_run_id }}
          github-token: ${{ github.token }}
      - name: Restore published build history
        id: history
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          SOURCE_REF: ${{ steps.source.outputs.ref }}
          BUILD_RUN_ID: ${{ inputs.build_run_id }}
          BUILD_ATTEMPT: ${{ inputs.build_attempt }}
        run: |
          python3 scripts/pages-state.py --repository "$GITHUB_REPOSITORY" prepare \
            --run-id "$GITHUB_RUN_ID" --attempt "$GITHUB_RUN_ATTEMPT" \
            --commit "$SOURCE_COMMIT" --ref "$SOURCE_REF" --site-url "$SITE_URL" \
            --build-run-id "$BUILD_RUN_ID" --build-attempt "$BUILD_ATTEMPT" \
            --artifact-dir build/switch --previous-dir build/pages-previous \
            --github-output "$GITHUB_OUTPUT"
      - name: Install publisher compiler
        run: rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal
      - name: Generate download page and update feed
        env:
          BUILD_CHANNEL: ${{ steps.source.outputs.channel }}
          BUILD_TAG: ${{ steps.source.outputs.tag }}
          BUILD_TIMESTAMP: ${{ steps.source.outputs.timestamp }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          HAS_PREVIOUS: ${{ steps.history.outputs.has_previous }}
        run: |
          arguments=(
            --artifact-dir build/switch --output-dir build/pages
            --channel "$BUILD_CHANNEL" --timestamp "$BUILD_TIMESTAMP"
            --commit "$SOURCE_COMMIT" --base-url "$SITE_URL"
          )
          if [[ "$HAS_PREVIOUS" == true ]]; then
            arguments+=(--previous-dir build/pages-previous)
          fi
          if [[ "$BUILD_CHANNEL" == version ]]; then
            arguments+=(--tag "$BUILD_TAG")
          fi
          cargo run --locked --release -p wodex-publish-pages -- "${arguments[@]}"
      - name: Preserve publication snapshot
        id: snapshot
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: wodex-pages-state-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: build/pages
      - name: Deploy download page
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Verify public downloads
        timeout-minutes: 12
        run: python3 scripts/verify-pages.py --site-url "$SITE_URL" --site-dir build/pages
      - name: Retain two recovery snapshots
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          CURRENT_ARTIFACT_ID: ${{ steps.snapshot.outputs.artifact-id }}
          PREVIOUS_ARTIFACT_ID: ${{ steps.history.outputs.previous_artifact_id }}
        run: |
          arguments=(--repository "$GITHUB_REPOSITORY" prune --current-id "$CURRENT_ARTIFACT_ID")
          if [[ -n "$PREVIOUS_ARTIFACT_ID" ]]; then
            arguments+=(--previous-id "$PREVIOUS_ARTIFACT_ID")
          fi
          python3 scripts/pages-state.py "${arguments[@]}"
