[package]
name = "wodex-core"
version = "0.2.1"
edition = "2021"
license = "WTFPL"
description = "Wodex application and I/O backends for no_std Switch and desktop"

[lib]
crate-type = ["rlib", "staticlib"]

[features]
default = ["std"]
std = ["serde/std", "serde_json/std"]

[dependencies]
pulldown-cmark = { git = "https://github.com/pulldown-cmark/pulldown-cmark", rev = "baa6ac73b677c43c075f5b2b8db0b47897fdc021", default-features = false, features = ["hashbrown"] }
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = { version = "1", default-features = false, features = ["alloc"] }
sha2 = { version = "0.10.9", default-features = false, features = ["force-soft"] }
tokn-endpoint-chat-completions = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
tokn-endpoint-core = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
tokn-core = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
tokn-headers = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
tokn-convert = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
tokn-provider-deepseek = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
tokn-provider-openai = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
tokn-provider-opencode = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
tokn-provider-llama-cpp = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
tokn-provider-zai = { git = "https://github.com/tokn-ai/tokn", rev = "d546ef2d306e9a952a17eae8a58366483832da05", default-features = false }
unicode-width = { version = "0.2.2", default-features = false }
zune-core = { version = "0.5.3", default-features = false }
zune-jpeg = { version = "0.5.15", default-features = false }
zune-png = { version = "0.5.2", default-features = false }
